name: Docker
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image bauen
        run: docker build -t app:${{ github.sha }} .
      - name: Smoke-Test
        run: |
          docker run -d -p 8080:8080 --name app app:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fs localhost:8080/actuator/health && exit 0
            sleep 2
          done
          docker logs app; exit 1
      - name: Login bei GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag app:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag app:${{ github.sha }} $IMAGE:latest
          docker push --all-tags $IMAGE
